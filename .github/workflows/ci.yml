name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap strace util-linux python3
      - name: Allow namespace tests on this disposable CI runner
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run check
      - run: npm test
        env:
          SKILLWALL_REQUIRE_SANDBOX: "1"
      - run: npm pack --dry-run
